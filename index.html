let db,items=[],settings={collections:[],tags:[],accent:'Sage'},tab='home',filter={q:'',collection:'',tag:'',type:'',feeling:''},draft=null,feelingRoot=4,feelingMid=-1,returnTab='library',urls=[],toastTimer;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('of-me-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('settings')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(stores,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(stores,mode);let output;try{output=fn(t)}catch(e){t.abort();rej(e);return}t.oncomplete=()=>res(output?.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Transaction cancelled'))})}

function list(a){return a.length?`<div class="stack">${a.map(i=>`<button class="item" data-open="${esc(i.id)}"><span class="thumb">${i.media?.type?.startsWith('image/')?`<img alt="" src="${objectURL(i.media)}">`:icons[i.type]||'◇'}</span><span><strong>${esc(i.title)}</strong><small>${esc(i.type)} · ${fmt(i.created)}${i.media?' · offline copy':''}</small>${i.feelings?.length?`<small>${esc(i.feelings.slice(0,3).join(' · '))}</small>`:''}</span><span class="arrow">›</span></button>`).join('')}</div>`:'<div class="empty">Nothing here yet. There is no rush.</div>'}
function home(){return `<div class="hero panel"><div class="eyebrow">The things that stay with me</div><h1>Things that<br>become me.</h1><p>A private place for the things that move you, teach you, and remind you of who you are.</p><button class="btn primary" data-go="save">+ Save a moment</button></div><section class="section"><div class="grid"><div class="panel stat"><div class="metric">${items.length}</div><div class="muted">Saved moments</div></div><div class="panel stat"><div class="metric">${settings.collections.length}</div><div class="muted">Collections</div></div></div></section><section class="section"><div class="sectionhead"><h2>Recently kept</h2><button class="ghost" data-go="library">View all</button></div>${list(items.slice(0,5))}</section><section class="section"><div class="panel stack"><div class="eyebrow">Rediscovery</div><h2>Meet a past version of yourself.</h2><p class="muted">Revisit one thing you saved. Does it still feel like you?</p><button class="btn" id="rediscover" ${items.length?'':'disabled'}>Surprise me</button></div></section>`}

ption ${filter.tag===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="ftype" aria-label="Media type"><option value="">All media</option>${types.map(t=>`<option ${filter.type===t?'selected':''}>${t}</option>`).join('')}</select><select id="ffeeling" aria-label="Feeling"><option value="">All feelings</option>${uniq(items.flatMap(i=>i.feelings||[])).sort().map(t=>`<option ${filter.feeling===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="row between"><span class="muted">${a.length} ${a.length===1?'moment':'moments'}</span><button class="ghost" id="clearFilters">Clear filters</button></div><div id="results">${list(a)}</div></section>`}

function wheel(){let pos=0;const total=emotions.reduce((n,e)=>n+e[2].length,0);let parts='';emotions.forEach((e,ri)=>{const a=pos*360/total,b=(pos+e[2].length)*360/total,[x,y]=arc(180,180,72,(a+b)/2);parts+=`<path data-root="${ri}" d="${wedge(0.01,105,a,b)}" fill="${e[1]}" opacity="${feelingRoot===ri?1:.72}" tabindex="0" role="button" aria-label="Explore ${e[0]}"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${e[0]}</text>`;e[2].forEach((m,mi)=>{const aa=(pos+mi)*360/total,bb=(pos+mi+1)*360/total;parts+=`<path data-root="${ri}" data-mid="${mi}" d="${wedge(106,141,aa,bb)}" fill="${e[1]}" opacity="${feelingRoot===ri&&feelingMid===mi?1:.55}"><title>${m[0]}</title></path>`;m.slice(1).forEach((w,wi)=>{let aaa=aa+(bb-aa)*wi/2,bbb=aa+(bb-aa)*(wi+1)/2;parts+=`<path data-root="${ri}" data-mid="${mi}" data-word="${esc(w)}" d="${wedge(142,177,aaa,bbb)}" fill="${e[1]}" opacity="${draft.feelings.includes(w)?1:.76}"><title>${esc(w)}</title></path>`})});pos+=e[2].length});const e=emotions[feelingRoot];return `<div class="stack"><svg class="wheel" viewBox="0 0 360 360" aria-label="Interactive feelings wheel">${parts}</svg><div class="chips">${emotions.map((x,i)=>`<button type="button" class="pill ${i===feelingRoot?'on':''}" data-root="${i}">${x[0]}</button>`).join('')}</div><div class="feeling-options"><div class="row between"><strong>${e[0]}</strong><button class="pill ${draft.feelings.includes(e[0])?'on':''}" data-feel="${e[0]}">${draft.feelings.includes(e[0])?'✓ Selected':'+ Select'}</button></div><p class="help">Explore a more specific feeling:</p><div class="chips feelhead">${e[2].map((m,i)=>`<button class="pill ${i===feelingMid?'on':''}" data-root="${feelingRoot}" data-mid="${i}">${esc(m[0])}</button>`).join('')}</div>${feelingMid>=0?`<div class="divider"></div><div class="chips">${e[2][feelingMid].map(w=>`<button class="pill ${draft.feelings.includes(w)?'on':''}" data-feel="${esc(w)}">${draft.feelings.includes(w)?'✓ ':''}${esc(w)}</button>`).join('')}</div>`:''}</div><div class="chips">${['Nostalgic','Tender','Longing','Admiration','Bittersweet','Moved'].map(w=>`<button class="pill ${draft.feelings.includes(w)?'on':''}" data-feel="${w}">${w}</button>`).join('')}</div><div class="row"><input id="customFeeling" placeholder="Add your own feeling" style="flex:1;min-width:120px"><button class="btn" id="addFeeling">Add</button></div><div><label>Selected feelings</label><div class="chips">${draft.feelings.length?draft.feelings.map(w=>`<button class="pill on" data-feel="${esc(w)}">${esc(w)} ×</button>`).join(''):'<span class="muted">None selected yet.</span>'}</div></div><details><summary>View the full reference wheel</summary><img src="feelings-wheel.jpeg" alt="Full reference feelings wheel" style="width:100%;margin-top:12px;border-radius:12px"></details></div>`}
function save(){return `<div class="sectionhead"><h1>${items.some(i=>i.id===draft.id)?'Edit moment':'Keep a moment'}</h1></div><p class="muted">Save now. Understand it whenever you're ready.</p><section class="section panel stack"><div><label for="url">Link (optional)</label><input id="url" data-field="url" type="text" inputmode="url" placeholder="Paste a video, pin, song or article link" value="${esc(draft.url)}"><button class="ghost" id="paste">Paste from clipboard</button></div><div><label for="title">Give it a name</label><input id="title" data-field="title" placeholder="What is it?" value="${esc(draft.title)}"></div><div><label for="type">Media type</label><select id="type" data-field="type">${types.map(t=>`<option ${draft.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="media">Keep an offline copy (optional)</label><input id="media" type="file" accept="image/*,video/*,audio/*"><p class="help" id="mediaStatus">${draft.media?esc(draft.mediaName)+' · '+Math.round(draft.media.size/1024)+' KB':'Attach a photo, video or audio file from your device. Links alone do not preserve the media.'}</p>${draft.media?'<button class="ghost" id="removeMedia">Remove attachment</button>':''}</div><button class="btn primary full" id="quickCommit">Save now, reflect later</button></section><section class="section panel"><div class="sectionhead"><h2>Collections</h2><button class="ghost" id="newCollection">+ New</button></div><p class="help">Choose as many as you like. Leave empty to use Inbox.</p><div class="checklist">${settings.collections.length?settings.collections.map(c=>`<label><input type="checkbox" data-coll="${esc(c.id)}" ${draft.collections.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join(''):'<p class="muted">Create your first collection.</p>'}</div></section><section class="section panel stack"><h2>Tags</h2><div class="chips">${draft.tags.map(t=>`<button class="pill on" data-remtag="${esc(t)}">${esc(t)} ×</button>`).join('')}</div><select id="tagSelect"><option value="">Choose an existing tag…</option>${settings.tags.filter(t=>!draft.tags.includes(t)).map(t=>`<option>${esc(t)}</option>`).join('')}</select><div class="row"><input id="newTag" placeholder="Create a tag" style="flex:1;min-width:100px"><button class="btn" id="addTag">Add</button></div></section><section class="section panel"><h2>What does it make me feel?</h2><p class="help">Tap the wheel or explore the words below it. Select as many feelings as you need.</p><div id="wheelArea">${wheel()}</div></section><section class="section panel"><h2>What makes it part of me?</h2>${field('reason','Why did I save this?','What stood out to me?')}${field('meaning','What does it mean to me?','What does it reveal about what I value, desire or believe?')}${field('application','Where does it apply in my life?','Something I want to remember, practice or become…')}${field('notes','Anything else?','Quotes, context, ideas, observations…')}</section><div class="section stack"><button class="btn primary full" id="commit">${items.some(i=>i.id===draft.id)?'Save changes':'Keep this moment'}</button><button class="ghost" id="cancel">Cancel</button></div>`}
let selectedId=null;
function detail(){const i=items.find(x=>x.id===selectedId);if(!i)return '<p>Moment not found.</p>';const media=i.media?i.media.type.startsWith('image/')?`<img class="media" src="${objectURL(i.media)}" alt="${esc(i.title)}">`:i.media.type.startsWith('video/')?`<video class="media" src="${objectURL(i.media)}" controls playsinline preload="metadata"></video>`:i.media.type.startsWith('audio/')?`<audio class="media" src="${objectURL(i.media)}" controls preload="metadata"></audio>`:'': '';return `<button class="ghost" id="back">‹ Back</button><div class="stack"><div class="eyebrow">${esc(i.type)} · ${fmt(i.created)}</div><h1>${esc(i.title)}</h1>${media?`<div class="panel">${media}<p class="help">Offline copy</p></div>`:''}${safeURL(i.url)?`<a class="btn linkbox" href="${esc(safeURL(i.url))}" target="_blank" rel="noopener noreferrer">Open original ↗</a>`:''}<div class="chips">${(i.collections||[]).map(c=>`<span class="chip">${esc(collectionName(c))}</span>`).join('')}${(i.tags||[]).map(t=>`<button class="pill" data-filtertag="${esc(t)}">#${esc(t)}</button>`).join('')}</div><div class="panel stack"><h2>My reflection</h2>${i.feelings?.length?`<div><label>What it makes me feel</label><div class="chips">${i.feelings.map(w=>`<button class="pill on" data-filterfeeling="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`:''}${[['reason','Why I saved it'],['meaning','What it means to me'],['application','Where it applies'],['notes','Other notes']].filter(([k])=>i[k]).map(([k,l])=>`<div><label>${l}</label><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(i[k])}</p></div>`).join('')}${!i.feelings?.length&&!i.reason&&!i.meaning&&!i.application&&!i.notes?'<p class="muted">Still waiting to be reflected on. Whenever you feel ready.</p>':''}<button class="btn" id="editItem">Edit moment</button></div><div class="panel stack"><h2>Revisiting</h2><p class="muted">Keep your first reflection, then record how it feels today.</p>${(i.reflections||[]).map(r=>`<div><div class="eyebrow">${fmt(r.date)}</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.text)}</p></div>`).join('')}<textarea id="revisitText" placeholder="What do I notice now?"></textarea><button class="btn" id="addReflection">Add reflection</button></div><button class="danger" id="deleteItem">Delete moment</button></div>`}
function rank(key){let counts=new Map();items.forEach(i=>uniq(i[key]||[]).forEach(t=>counts.set(t,(counts.get(t)||0)+1)));return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}
function mirror(){const tags=rank('tags'),feel=rank('feelings'),reflected=items.filter(i=>i.reason||i.meaning||i.application||i.feelings?.length).length;return `<h1>The Mirror</h1><p class="muted">Patterns, not predictions. You decide what they mean.</p><section class="section panel stack"><div class="eyebrow">Reflection</div><div class="metric">${reflected} / ${items.length}</div><p class="muted">Moments you've started reflecting on.</p><div class="bar"><span style="width:${items.length?reflected/items.length*100:0}%"></span></div><button class="btn" id="unreflected" ${reflected===items.length?'disabled':''}>Reflect on an unexamined save</button></section><section class="section"><h2>Recurring feelings</h2><div class="stack" style="margin-top:12px">${feel.length?feel.map(([t,n])=>`<button class="panel" style="text-align:left" data-filterfeeling="${esc(t)}"><div class="row between"><strong>${esc(t)}</strong><span class="muted">${n} ${n===1?'moment':'moments'}</span></div><div class="bar"><span style="width:${n/feel[0][1]*100}%"></span></div></button>`).join(''):'<div class="empty">Your feelings will gather here as you reflect.</div>'}</div></section><section class="section"><h2>Threads of meaning</h2><p class="help">Tags can connect things that live in different collections.</p><div class="stack" style="margin-top:12px">${tags.length?tags.map(([t,n])=>{const related=uniq(items.filter(i=>i.tags?.includes(t)).flatMap(i=>i.collections||[])).map(collectionName).filter(Boolean);return `<button class="panel" style="text-align:left" data-filtertag="${esc(t)}"><div class="row between"><strong>#${esc(t)}</strong><span class="muted">${n} saved</span></div><p class="help">${related.length?esc(related.join(' · ')):'Not filed in a collection yet.'}</p></button>`}).join(''):'<div class="empty">Your shared tags will reveal connections here.</div>'}</div></section><section class="section panel stack"><h2>From saved to lived</h2>${items.some(i=>i.application)?items.filter(i=>i.application).map(i=>`<button class="btn" style="text-align:left" data-open="${esc(i.id)}"><strong>${esc(i.title)}</strong><p class="smalltext">${esc(i.application)}</p></button>`).join(''):'<p class="muted">Ideas from your “Where does it apply in my life?” reflections will appear here.</p>'}</section>`}
function settingsPage(){return `<h1>Settings</h1><section class="section panel stack"><h2>Make it yours</h2><label>Accent colour</label><div class="row">${colors.map(c=>`<button aria-label="${c[0]}" title="${c[0]}" class="swatch ${settings.accent===c[0]?'on':''}" style="background:${c[1]}" data-accent="${c[0]}"></button>`).join('')}</div><p class="muted">${esc(settings.accent)}</p></section><section class="section panel stack"><h2>Quick capture</h2><p>Use the iPhone Share Sheet shortcut to collect links or photos into an iCloud Drive folder, then import them here. Or paste a link directly into Save.</p><button class="btn" id="shortcutInfo">Shortcut instructions</button><label for="inboxFiles">Import shared files (multiple allowed)</label><input id="inboxFiles" type="file" multiple accept=".txt,.url,image/*,video/*,audio/*"><p class="help">Creates one unfiled save per media file or unique link in a text file. Imported files are copied into this app.</p></section><section class="section panel stack"><h2>Your archive</h2><p class="muted">Stored on this device in the browser's IndexedDB. No account, server or analytics. It does not sync automatically to iCloud. Export backups and save them to Files.</p><button class="btn primary" id="export">Export complete backup</button><label for="restore">Restore from a backup (merges by ID)</label><input id="restore" type="file" accept=".json,application/json"><p class="help">Includes notes, collections, tags, feelings and attached media. Large archives can take memory and time to export; keep media copies in Files too.</p><button class="btn" id="storage">Check device storage</button></section><section class="section panel stack"><h2>About Of Me</h2><p class="muted">Version 0.1 · Private by design, local to your device. Original links may stop working if a creator removes the post. No autoplay or endless feed.</p></section>`}
function openItem(x){returnTab=tab==='home'?'home':tab==='mirror'?'mirror':'library';selectedId=x;tab='detail';render();window.scrollTo(0,0)}
function on(s,fn,event='click'){const e=$(s);if(e)e.addEventListener(event,fn)}
function refreshWheel(){$('#wheelArea').innerHTML=wheel();bindWheel()}
function bindWheel(){const area=$('#wheelArea');if(!area)return;area.querySelectorAll('[data-root]').forEach(e=>{const action=()=>{feelingRoot=Number(e.dataset.root);feelingMid=e.dataset.mid==null?-1:Number(e.dataset.mid);if(e.dataset.word)toggleFeeling(e.dataset.word);else refreshWheel()};e.onclick=action;e.onkeydown=ev=>{if((ev.key==='Enter'||ev.key===' ')&&e.tagName.toLowerCase()==='path'){ev.preventDefault();action()}}});area.querySelectorAll('[data-feel]').forEach(e=>e.onclick=()=>toggleFeeling(e.dataset.feel));on('#addFeeling',()=>{const w=$('#customFeeling').value.trim();if(w){if(!draft.feelings.some(x=>norm(x)===norm(w)))draft.feelings.push(w);refreshWheel()}})}
function toggleFeeling(w){draft.feelings=draft.feelings.includes(w)?draft.feelings.filter(x=>x!==w):[...draft.feelings,w];refreshWheel()}
function modal(html){$('#modal').innerHTML=`<div class="modalcover"><div class="modal" role="dialog" aria-modal="true">${html}<div class="row"><button class="ghost" id="closeModal">Close</button></div></div></div>`;on('#closeModal',closeModal);$('.modalcover').onclick=e=>{if(e.target===$('.modalcover'))closeModal()}}
function closeModal(){$('#modal').innerHTML=''}
function collectionModal(c){modal(`<div class="stack"><h2>${c?'Edit collection':'New collection'}</h2><input id="collectionInput" placeholder="Collection name" value="${esc(c?.name||'')}"><button class="btn primary" id="saveCollection">${c?'Save name':'Create collection'}</button>${c?'<button class="danger" id="removeCollection">Delete collection (keep moments)</button>':''}</div>`);on('#saveCollection',async()=>{const name=$('#collectionInput').value.trim();if(!name)return toast('Enter a collection name.');if(settings.collections.some(x=>norm(x.name)===norm(name)&&x.id!==c?.id))return toast('That collection already exists.');try{if(c)c.name=name;else{const x={id:id(),name};settings.collections.push(x);if(draft&&tab==='save')draft.collections.push(x.id)}await storeSettings();closeModal();render()}catch(e){error(e)}});on('#removeCollection',async()=>{if(!confirm('Delete this collection? Your saved moments will stay.'))return;try{settings.collections=settings.collections.filter(x=>x.id!==c.id);await tx(['items','settings'],'readwrite',t=>{const s=t.objectStore('items');items.filter(i=>i.collections?.includes(c.id)).forEach(i=>s.put({...i,collections:i.collections.filter(x=>x!==c.id)}));t.objectStore('settings').put(settings,'main')});filter.collection='';await reload();closeModal();render()}catch(e){error(e)}})}
function addTag(t){t=t.trim();if(!t)return;const old=settings.tags.find(x=>norm(x)===norm(t))||draft.tags.find(x=>norm(x)===norm(t));if(!draft.tags.includes(old||t))draft.tags.push(old||t);render()}
let saving=false;async function commit(){if(saving)return;const title=draft.title.trim(),u=extractURL(draft.url);if(draft.url.trim()&&!u)return toast('Enter a valid http or https link.');if(!title&&!u&&!draft.media)return toast('Add a name, link or attachment first.');if(!title)draft.title=draft.mediaName||`${detect(u)} save`;draft.url=u;draft.updated=Date.now();if(draft.type==='Other'&&u)draft.type=detect(u);const duplicate=u&&items.find(i=>!i.deletedAt&&i.url===u&&i.id!==draft.id);if(duplicate&&!confirm('This link is already saved. Keep a separate moment anyway?'))return;const next={...settings,tags:uniq([...settings.tags,...draft.tags]).sort((a,b)=>a.localeCompare(b))};try{saving=true;$('#commit').disabled=true;if($('#quickCommit'))$('#quickCommit').disabled=true;await tx(['items','settings'],'readwrite',t=>{t.objectStore('items').put(draft);t.objectStore('settings').put(next,'main')});selectedId=draft.id;draft=null;await reload();tab='detail';returnTab='library';render();window.scrollTo(0,0);toast('Kept ♡')}catch(e){error(e);if($('#commit'))$('#commit').disabled=false;if($('#quickCommit'))$('#quickCommit').disabled=false}finally{saving=false}}
function setFilter(k,v){filter={q:'',collection:'',tag:'',type:'',feeling:'',[k]:v};tab='library';render();window.scrollTo(0,0)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open));document.querySelectorAll('[data-filtertag]').forEach(b=>b.onclick=()=>setFilter('tag',b.dataset.filtertag));document.querySelectorAll('[data-filterfeeling]').forEach(b=>b.onclick=()=>setFilter('feeling',b.dataset.filterfeeling));on('#unreflected',()=>{const a=items.filter(i=>!i.reason&&!i.meaning&&!i.application&&!i.feelings?.length);if(a.length)openItem(a[Math.floor(Math.random()*a.length)].id)});on('#newCollection',()=>collectionModal());on('#editCollection',()=>collectionModal(settings.collections.find(c=>c.id===filter.collection)));document.querySelectorAll('[data-collection]').forEach(b=>b.onclick=()=>{setFilter('collection',b.dataset.collection);$('#search')?.scrollIntoView({block:'center'})});for(const [k,s] of Object.entries({collection:'fcollection',tag:'ftag',type:'ftype',feeling:'ffeeling'}))on('#'+s,e=>{filter[k]=e.target.value;render()},'change');on('#clearFilters',()=>{filter={q:'',collection:'',tag:'',type:'',feeling:''};render()});on('#search',e=>{filter.q=e.target.value;const cursor=e.target.selectionStart;render();$('#search').focus();try{$('#search').setSelectionRange(cursor,cursor)}catch{}},'input');
if(tab==='save'){document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{draft[e.dataset.field]=e.value;if(e.dataset.field==='url'&&extractURL(e.value)){const t=detect(e.value);if(t!=='Other'){draft.type=t;$('#type').value=t}}});document.querySelectorAll('[data-coll]').forEach(e=>e.onchange=()=>{draft.collections=e.checked?uniq([...draft.collections,e.dataset.coll]):draft.collections.filter(x=>x!==e.dataset.coll)});on('#media',e=>{const f=e.target.files[0];if(!f)return;draft.media=f;draft.mediaName=f.name;if(!draft.title)draft.title=f.name.replace(/\.[^.]+$/,'');if(draft.type==='Other')draft.type=f.type.startsWith('image/')?'Photo':f.type.startsWith('video/')?'Video':f.type.startsWith('audio/')?'Audio':'Other';render()},'change');on('#removeMedia',()=>{draft.media=null;draft.mediaName='';render()});on('#paste',async()=>{try{const text=await navigator.clipboard.readText();const u=extractURL(text);if(!u)return toast('No link found in clipboard.');draft.url=u;draft.type=detect(u);render()}catch{toast('Tap the link field and use Paste.')}});on('#tagSelect',e=>addTag(e.target.value),'change');on('#addTag',()=>addTag($('#newTag').value));document.querySelectorAll('[data-remtag]').forEach(b=>b.onclick=()=>{draft.tags=draft.tags.filter(x=>x!==b.dataset.remtag);render()});bindWheel();on('#commit',commit);on('#quickCommit',commit);on('#cancel',()=>go('library'))}
if(tab==='detail'){const i=items.find(x=>x.id===selectedId);on('#back',()=>go(returnTab));on('#editItem',()=>{newDraft({...i,collections:[...(i.collections||[])],tags:[...(i.tags||[])],feelings:[...(i.feelings||[])]});tab='save';render();window.scrollTo(0,0)});on('#deleteItem',async()=>{if(!confirm('Move this keepsake to Recently Deleted?'))return;try{await tx(['items'],'readwrite',t=>t.objectStore('items').put({...i,deletedAt:Date.now(),updated:Date.now()}));await reload();go('library');toast('Moved to Recently Deleted.')}catch(e){error(e)}});on('#addReflection',async()=>{const text=$('#revisitText').value.trim();if(!text)return;try{await tx(['items'],'readwrite',t=>t.objectStore('items').put({...i,updated:Date.now(),reflections:[...(i.reflections||[]),{date:Date.now(),text}]}));await reload();render();toast('Reflection added.')}catch(e){error(e)}})}
if(tab==='settings'){document.querySelectorAll('[data-accent]').forEach(b=>b.onclick=async()=>{try{settings.accent=b.dataset.accent;await storeSettings();applyTheme();render()}catch(e){error(e)}});on('#shortcutInfo',()=>modal(`<div class="stack"><h2>Save to Of Me</h2><p>In Shortcuts, create a shortcut called Save to Of Me. Turn on Show in Share Sheet and accept URLs and text.</p><p>Add Get URLs from Input, then Text containing the URL result, then Set Name using a unique name ending in .txt, then Save File. Choose iCloud Drive / Of Me Inbox. Turn off Ask Where to Save.</p><p>For photos/videos: create a separate shortcut accepting images/media, use Save File on Shortcut Input, and choose the same folder. Keep the original file extension.</p><p>In Of Me, Settings → Import shared files, select your new files from that folder. After confirming they imported, you can remove the inbox copies if you have another backup.</p><p class="muted">This avoids Safari and Home Screen app storage being separated. A direct link shortcut is available for Safari-only use via <code>?save=ENCODED_URL</code>, but may not open the same storage as your installed app.</p></div>`));on('#inboxFiles',e=>importInbox([...e.target.files]),'change');on('#export',exportBackup);on('#restore',e=>restoreBackup(e.target.files[0]),'change');on('#storage',async()=>{try{const q=await navigator.storage?.estimate?.();const media=items.reduce((a,i)=>a+(i.media?.size||0),0);modal(`<div class="stack"><h2>Storage</h2><p>Attached files: ${(media/1048576).toFixed(2)} MB</p><p>${q?.quota?`Browser estimate: ${(q.usage/1048576).toFixed(1)} MB used of ${(q.quota/1048576).toFixed(0)} MB quota.`:'Browser storage estimate unavailable.'}</p><p class="muted">Device storage and browser quotas can change. Back up important saves.</p></div>`)}catch(e){error(e)}})}}
async function importInbox(files){if(!files.length)return;try{const added=[],known=new Set(items.map(i=>i.url).filter(Boolean)),knownMedia=new Set(items.filter(i=>i.media).map(i=>`${i.mediaName}|${i.media.size}|${i.media.type}`));let skipped=0;for(const f of files){if(f.type.startsWith('text/')||/\.(txt|url)$/i.test(f.name)){const links=uniq((await f.text()).match(/https?:\/\/[^\s<>"']+/gi)||[]);for(const l of links){const u=safeURL(l);if(!u||known.has(u)){skipped++;continue}known.add(u);added.push({id:id(),created:Date.now(),updated:Date.now(),title:detect(u)+' save',type:detect(u),url:u,collections:[],tags:[],feelings:[],reason:'',meaning:'',application:'',notes:'',reflections:[]})}}else if(/^(image|video|audio)\//.test(f.type)){const key=`${f.name}|${f.size}|${f.type}`;if(knownMedia.has(key)){skipped++;continue}knownMedia.add(key);added.push({id:id(),created:Date.now(),updated:Date.now(),title:f.name.replace(/\.[^.]+$/,''),type:f.type.startsWith('image/')?'Photo':f.type.startsWith('video/')?'Video':'Audio',url:'',media:f,mediaName:f.name,collections:[],tags:[],feelings:[],reason:'',meaning:'',application:'',notes:'',reflections:[]})}else skipped++}await tx(['items'],'readwrite',t=>{const s=t.objectStore('items');added.forEach(i=>s.put(i))});await reload();setFilter('collection','inbox');toast(`${added.length} imported${skipped?', '+skipped+' skipped':''}.`)}catch(e){error(e)}}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function exportBackup(){const b=$('#export');b.disabled=true;b.textContent='Preparing backup…';try{const data=[];for(const i of items){const {media,...rest}=i;data.push({...rest,mediaData:media?await blobToData(media):null})}const file=new File([JSON.stringify({format:'of-me-backup',version:1,exportedAt:new Date().toISOString(),settings,items:data})],`of-me-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Of Me backup'});toast('Backup share sheet completed.');return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a'),u=URL.createObjectURL(file);a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Backup prepared. Keep it in Files.')}catch(e){error(e)}finally{b.disabled=false;b.textContent='Export complete backup'}}
function validStr(v){return typeof v==='string'?v:''}function stringList(v){return Array.isArray(v)?uniq(v.filter(x=>typeof x==='string')):[]}
async function restoreBackup(f){if(!f)return;try{const x=JSON.parse(await f.text());if(x.format!=='of-me-backup'||x.version!==1||!Array.isArray(x.items)||!Array.isArray(x.settings?.collections))throw new Error('Invalid backup');const fresh=[];for(const i of x.items){if(typeof i.id!=='string'||typeof i.title!=='string')throw new Error('Invalid item');const media=i.mediaData&&/^data:(image|video|audio)\//.test(i.mediaData)?await (await fetch(i.mediaData)).blob():null;fresh.push({id:i.id,title:i.title,created:Number(i.created)||Date.now(),updated:Number(i.updated)||Date.now(),type:types.includes(i.type)?i.type:'Other',url:safeURL(i.url),collections:stringList(i.collections),tags:stringList(i.tags),feelings:stringList(i.feelings),reason:validStr(i.reason),meaning:validStr(i.meaning),application:validStr(i.application),notes:validStr(i.notes),media,mediaName:validStr(i.mediaName),reflections:Array.isArray(i.reflections)?i.reflections.filter(r=>typeof r.text==='string').map(r=>({text:r.text,date:Number(r.date)||Date.now()})):[]})}const collections=new Map(settings.collections.map(c=>[c.id,c]));for(const c of x.settings.collections){if(typeof c.id==='string'&&typeof c.name==='string'&&!collections.has(c.id))collections.set(c.id,c)}const next={...settings,collections:[...collections.values()],tags:uniq([...settings.tags,...stringList(x.settings.tags),...fresh.flatMap(i=>i.tags)]).sort(),accent:colors.some(c=>c[0]===x.settings.accent)?x.settings.accent:settings.accent};const toSave=fresh.filter(i=>!items.some(y=>y.id===i.id&&y.updated>=i.updated));if(!confirm(`Merge ${toSave.length} new or updated moments into your archive? Existing newer moments are kept.`))return;await tx(['items','settings'],'readwrite',t=>{const s=t.objectStore('items');toSave.forEach(i=>s.put(i));t.objectStore('settings').put(next,'main')});await reload();render();toast('Backup restored.')}catch(e){console.error(e);toast('Could not restore this backup. Check that it is an Of Me JSON file.')}}
async function init(){try{db=await openDB();await reload();const p=new URLSearchParams(location.search),u=extractURL(p.get('save')||'');if(u){newDraft({url:u,type:detect(u)});tab='save';history.replaceState(null,'',location.pathname+location.hash)}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.warn)}catch(e){console.error(e);$('#app').innerHTML='<div class="panel stack"><h2>Storage unavailable</h2><p>Open Of Me in Safari from its hosted HTTPS address. Private browsing or a local file preview may not allow persistent storage.</p></div>'}}
if(window.visualViewport){const fitViewport=()=>document.documentElement.style.setProperty('--visible-height',window.visualViewport.height+'px');window.visualViewport.addEventListener('resize',fitViewport);fitViewport()}
